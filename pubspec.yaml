name: cut_optimiser
description: Cross-platform sheet and linear cutting optimiser.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  csv: ^6.0.0
  file_selector: ^1.0.3
  pdf: 3.10.0
  printing: ^5.13.4

dependency_overrides:
  image: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
