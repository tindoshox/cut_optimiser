name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            target: windows
          - id: linux-x64
            runner: ubuntu-latest
            target: linux
          - id: android-arm64
            runner: ubuntu-latest
            target: android
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      - if: matrix.target == 'windows'
        run: flutter build windows --release
      - if: matrix.target == 'linux'
        run: flutter build linux --release
      - if: matrix.target == 'android'
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Package Windows x64
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cut_optimiser-windows-x64.zip

      - name: Package Linux x64
        if: matrix.target == 'linux'
        run: tar -czf cut_optimiser-linux-x64.tar.gz -C build/linux/x64/release bundle

      - name: Package Android arm64
        if: matrix.target == 'android'
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk cut_optimiser-android-arm64-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: cut_optimiser-*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes
